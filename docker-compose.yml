version: '3.8'

services:
  mini-g-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-g-robotics-platform
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
